name: Release Windows installer

on:
  pull_request:
    paths:
      - 'windows-installer/**'
      - '.github/workflows/release-windows-installer.yml'
  push:
    branches: ['main']
    paths:
      - 'windows-installer/**'
      - '.github/workflows/release-windows-installer.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Tag de release a recuperar (deve corresponder ao VERSION, por exemplo v1.0.1)'
        required: true
        default: 'v1.0.1'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Agentes Farmacêuticos
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          path: pharmaceutical
          fetch-depth: 1
          persist-credentials: false

      - name: Require repository token for unified installer build
        if: env.FRAMEWORK_REPOSITORIES_TOKEN == ''
        env:
          FRAMEWORK_REPOSITORIES_TOKEN: ${{ secrets.FRAMEWORK_REPOSITORIES_TOKEN }}
        shell: pwsh
        run: throw 'FRAMEWORK_REPOSITORIES_TOKEN is required to build the unified installer from the private Otimizações IA repository.'

      - name: Checkout Otimizações IA
        uses: actions/checkout@v4
        with:
          repository: FernandoRD/ai-agent-framework-v5
          ref: 4fffa2622122dd5b45724d2653a9d7ff7622f617
          path: optimizations
          token: ${{ secrets.FRAMEWORK_REPOSITORIES_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content pharmaceutical/windows-installer/VERSION -Raw).Trim()
          $isReleaseRun = '${{ github.ref_type }}' -eq 'tag' -or '${{ github.event_name }}' -eq 'workflow_dispatch'
          if ($isReleaseRun -and $env:RELEASE_REF -ne "v$version") {
            throw "Tag must be v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate payload inputs
        shell: pwsh
        run: >-
          ./pharmaceutical/windows-installer/Validate-Local.ps1
          -PharmaceuticalSource ./pharmaceutical
          -OptimizationsSource ./optimizations
          -InstallerVersion "${{ steps.version.outputs.version }}"

      - name: Prepare installer payload
        shell: pwsh
        run: >-
          ./pharmaceutical/windows-installer/Prepare-Payload.ps1
          -PharmaceuticalSource ./pharmaceutical
          -OptimizationsSource ./optimizations
          -OutputPath ./pharmaceutical/windows-installer/staging

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile executable
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DInstallerVersion=${{ steps.version.outputs.version }} ./pharmaceutical/windows-installer/UnifiedFrameworkInstaller.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: pharmaceutical/windows-installer/output/Instalador-Framework-Windows-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          files: pharmaceutical/windows-installer/output/Instalador-Framework-Windows-*.exe
